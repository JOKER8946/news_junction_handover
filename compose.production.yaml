# Use with: docker compose -f compose.yaml -f compose.production.yaml --profile production up -d --build
services:
  app:
    environment:
      APP_ORIGIN: ${PRODUCTION_APP_ORIGIN:?Set an https production origin}
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?Set the restricted runtime database URL}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: '1'
      MAX_UPLOAD_BYTES_PER_MONTH: ${MAX_UPLOAD_BYTES_PER_MONTH:-2147483648}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 1.0
  proxy:
    image: caddy:2-alpine
    profiles: [production]
    environment:
      SITE_HOST: ${SITE_HOST:?Set the domain pointing to this server}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
